# إعدادات بناء الموقع على قيت هب (Jekyll)
encoding: utf-8
lang: ar
# بدون قالب جاهز من قيت هب: الموقع له تصميمه الخاص
theme: null

# مركز الوثائق: كل ملف داخل _docs يصير صفحة على الرابط /docs/رمز-الوثيقة/
collections:
  docs:
    output: true
    permalink: /docs/:name/
  # صفحات فريق بِكسلة (بطاقات NFC): كل ملف داخل _team يصير صفحة على الرابط /اسم-الملف/ مثل sifdim.sa/saeed
  team:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: team
    values:
      layout: member
  - scope:
      path: ""
      type: docs
    values:
      layout: doc

exclude:
  - README.md
  - sifdim-website.zip

# ملف التبليغ عن الثغرات: sifdim.sa/.well-known/security.txt
include:
  - .well-known
