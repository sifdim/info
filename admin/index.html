<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة تحكم سيفديم</title>
  <!-- العنوان الذي تفتحه هذه الصفحة: لوحة Pages CMS على مستودع الموقع (الحساب/المستودع/الفرع) -->
  <meta http-equiv="refresh" content="1; url=https://app.pagescms.org/sifdim/info/main">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../assets/css/brand.css">
  <style>
    html,body{margin:0;height:100%;background:var(--sifdim-navy);color:#C3CAD6;font-family:var(--font)}
    main{min-height:100%;display:grid;place-content:center;justify-items:center;gap:22px;padding:24px;text-align:center}
    img{height:48px;width:auto}
    h1{margin:0;font-size:24px;font-weight:600;color:#FBF8F2}
    p{margin:0;font-size:16px;line-height:1.8}
    a.btn{display:inline-block;font-size:15px;font-weight:600;color:var(--sifdim-navy);background:var(--sifdim-gold);border-radius:999px;padding:9px 22px;text-decoration:none}
    a.btn:focus-visible{outline:2px solid #FBF8F2;outline-offset:3px}
    small{font-size:14px;color:#8E98A9}
    small a{color:var(--sifdim-gold)}
  </style>
</head>
<body>
<main>
  <img src="../assets/img/logo-on-dark.png" alt="سيفديم">
  <h1>جارٍ فتح لوحة التحكم</h1>
  <p>الدخول بحساب قيت هب الذي يملك صلاحية على مستودع الموقع.</p>
  <a class="btn" href="https://app.pagescms.org/sifdim/info/main">فتح لوحة التحكم</a>
  <small>إذا لم تفتح، ادخل من <a href="https://app.pagescms.org">الصفحة الرئيسية للوحة</a> واختر المستودع.</small>
</main>
<script>
  setTimeout(function () { location.replace('https://app.pagescms.org/sifdim/info/main'); }, 600);
</script>
</body>
</html>
