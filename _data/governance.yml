label: الحوكمة
title: كل ما نلتزم به مكتوب ومنشور
lead: نعمل بمنهجية إدارة المشاريع الاحترافية. كل مشروع يمر بخمس مجموعات عمليات، ولكل مجموعة سجل يثبت ما جرى فيها.
steps:
- name: البدء
  text: ميثاق مشروع يحدد الهدف والعميل والممارسين وحدود الصلاحية.
- name: التخطيط
  text: بيان نطاق ومعايير قبول وخطة جودة وسجل مخاطر قبل أول يوم عمل.
- name: التنفيذ
  text: الممارس ينفّذ تحت إشراف مرشد، وكل مخرج يوثَّق باسم منفّذه.
- name: المراقبة والتحكم
  text: فحص جودة قبل كل تسليم، ولا تغيير في النطاق إلا بطلب تغيير معتمد.
- name: الإغلاق
  text: قبول مكتوب من العميل، وتقييم للممارس، وتسجيل الدروس المستفادة.
docs_title: وثائقنا المنشورة
docs_button: مركز الوثائق
