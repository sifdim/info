kicker: مؤسسة سيفديم للحلول المبتكرة، أبها
title: نوقظ قدرات المجتمع، ونمكّنها، ثم نطلقها
lede: نتعاقد مع المنشآت ونطوّر حلولاً تقنية، ويتولى التنفيذ ممارسون مستقلون من أبناء المجتمع نؤهّلهم عبر مشاريعنا التخصصية، ونشغّلهم بعقود موثقة تضمن لهم الدخل والخبرة والمسار المهني.
verb_1: أيقِظ
verb_2: مكِّن
verb_3: أطلِق
ticker_ar: من المجتمع، وإلى المجتمع
ticker_en: From the community, to the community
ticker_en_1: Awaken
ticker_en_2: Enable
