label: الرؤية
vision: أن نكون المظلة المؤسسية الرائدة في تمكين أبناء المجتمع من العمل الحر المحوكم، حتى يجد كل صاحب قدرة عملاً موثقاً ومساراً واضحاً إلى الاستقلال.
mission: نؤهّل أبناء المجتمع عبر مشاريعنا التخصصية، ونشغّلهم بعقود مؤسسية محوكمة تحقق لهم الدخل والخبرة، حتى ينطلقوا ممارسين مستقلين وأصحاب مشاريع.
values:
- name: الأصالة
  text: نستمد حلولنا من هوية المكان وأهله.
- name: الحوكمة
  text: كل عمل يقوم على عقد موثق.
- name: الأثر
  text: نقيس نجاحنا بما يتحقق للممارس والمجتمع.
- name: الإتقان
  text: الجودة التزام ثابت في كل عقد.
- name: الشراكة
  text: نبني القيمة مع المجتمع وشركائنا.
