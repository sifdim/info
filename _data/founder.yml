label: المؤسس
name: سعيد آل جهاش
bio: بدأ ممارساً حراً، وقاد مؤسسات، ثم أسّس سيفديم ليحوّل خبرته إلى نموذج مؤسسي يفتح الطريق لغيره.
photo: /assets/img/founder.jpg
stages:
- year: '2014'
  title: الممارسة والريادة
  text: أسّس مشروعاً لصيانة الأجهزة النقالة بلغ مستوى إصلاح الدوائر المتكاملة في اللوحة الأم، وتوسّع إلى مشاريع في البرمجة والصيانة. ممارس للعمل الحر منذ ذلك الحين.
- year: '2019'
  title: الجودة والقيادة
  text: الجودة والتفتيش والتدقيق، ثم القيادة التنفيذية في القطاعات الحكومية والتعاونية وغير الربحية.
- year: '2026'
  title: سيفديم
  text: مستشار في التحول الرقمي المؤسسي، ومؤسس سيفديم للحلول المبتكرة.
