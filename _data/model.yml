label: نموذج العمل
title: محرّكان للإيراد، ومسار مهني واحد للممارس
engines:
  - tag: عقود التشغيل المؤسسي
    title: التنظيم الإداري، والحضور الرقمي، والمتاجر الإلكترونية للمنشآت
    note: "العقد الأول: منشأة تحتاج تطوير الوصول الرقمي ، لمدة ثلاثة أشهر"
  - tag: منتجات سيفديم
    title: حلول تقنية لاحتياجات محلية، يشغّلها أبناء المنطقة
pillars:
  - title: العمل الحر المحوكم
    text: تسجيل رسمي لكل ممارس، وتوثيق لكل عقد، وحماية لكل بيانات.
  - title: التأهيل قبل الإسناد
    text: تأهيل عبر مشاريعنا التخصصية، وسجل أعمال موثق لكل ممارس.
  - title: التشغيل بعقود مؤسسية
    text: المؤسسة مسؤولة عن الجودة أمام العميل، والممارس ينفّذ وفق معاييرها.
  - title: الشراكات والاستدامة
    text: إيرادات متنوعة تموّل التوسع في العقود والمنتجات.
