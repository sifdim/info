label: من نحن
statement: مظلة مؤسسية لتشغيل أبناء المجتمع في العمل الحر المحوكم. نتعاقد مع العملاء بصفتنا الجهة المسؤولة عن التنفيذ والجودة، ونُسند الأعمال إلى ممارسين مستقلين نؤهّلهم عبر مشاريعنا التخصصية.
note: يحصل العميل على خدمة احترافية مضمونة الجودة، ويحصل الممارس على دخل موثق وخبرة تراكمية.
edge_label: ميزتنا التنافسية
edge_title: لا إسناد قبل التأهيل
edge_text: يتأهّل كل ممارس عبر مشاريعنا التخصصية حتى يثبت جاهزيته، ويستكمل تسجيله في المنصات الحكومية للعمل الحر، ثم يُسند إليه العمل لدى عملائنا. بذلك نضمن جودة التنفيذ من اليوم الأول.
